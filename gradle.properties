org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=true
# compileSdk 36 is newer than the AGP in use has been tested against. The platform
# jar is stable, so the build is fine; this silences the advisory warning.
android.suppressUnsupportedCompileSdk=36
